<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <aside class="sidebar">

            <button class="new-chat">
                + Новый чат
            </button>

            <div class="chat-history"></div>

            <div class="sidebar-bottom">
                <button>⚙️ Настройки</button>
            </div>

        </aside>

        <main class="main">

            <header class="topbar">
                <div class="logo">
                    My AI
                </div>

                <div class="user">
                    👤
                </div>
            </header>

            <section class="chat">

                <div class="welcome">
                    <h1>Чем я могу помочь?</h1>
                    <p>Задай любой вопрос ИИ.</p>
                </div>

            </section>

            <div class="input-area">

                <div class="input-box">

                    <textarea
                        id="messageInput"
                        placeholder="Напишите сообщение..."
                        rows="1"
                    ></textarea>

                    <button id="sendButton">
                        ➤
                    </button>

                </div>

                <p class="disclaimer">
                    My AI может допускать ошибки.
                </p>

            </div>

        </main>

    </div>

    <script src="script.js"></script>

</body>
</html>
